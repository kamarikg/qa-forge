name: QA Forge CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Go + PostgreSQL + Python
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: qa_forge_test
          POSTGRES_USER: qa_forge
          POSTGRES_PASSWORD: qa_forge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U qa_forge -d qa_forge_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      QA_FORGE_TEST_DATABASE_URL: postgres://qa_forge:qa_forge@localhost:5432/qa_forge_test
      DATABASE_URL: postgres://qa_forge:qa_forge@localhost:5432/qa_forge_test
      QA_FORGE_BASE_URL: http://127.0.0.1:8080

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest requests
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Wait for PostgreSQL
        run: |
          for attempt in $(seq 1 30); do
            if pg_isready -h localhost -p 5432 -U qa_forge -d qa_forge_test; then
              exit 0
            fi
            sleep 2
          done
          echo "PostgreSQL did not become ready"
          exit 1

      - name: Prepare database schema
        run: |
          psql "$QA_FORGE_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          CREATE TABLE IF NOT EXISTS users (
              id INTEGER GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
              name TEXT NOT NULL,
              email TEXT NOT NULL
          );
          SQL

      - name: Go tests
        working-directory: go
        run: go test -count=1 ./...

      - name: Go race detector
        working-directory: go
        run: go test -race -count=1 ./...

      - name: Go vet
        working-directory: go
        run: go vet ./...

      - name: Repository contract tests
        working-directory: go
        run: go test -count=3 ./cmd/health -run TestUserRepositoryContract

      - name: Start Go API
        working-directory: go
        run: |
          go run ./cmd/health > /tmp/qa-forge-api.log 2>&1 &
          echo $! > /tmp/qa-forge-api.pid

      - name: Wait for Go API
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8080/health/ > /dev/null; then
              echo "Go API is ready"
              exit 0
            fi
            sleep 2
          done
          cat /tmp/qa-forge-api.log
          echo "Go API did not become ready"
          exit 1

      - name: Python tests
        run: pytest -q

      - name: API logs on failure
        if: failure()
        run: |
          if [ -f /tmp/qa-forge-api.log ]; then
            cat /tmp/qa-forge-api.log
          fi
